<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>آکادمی دکتر میرهلی | سامانه آزمون آنلاین</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:Tahoma;background:#f5f7fb;color:#172033;margin:0}header{background:#173b67;color:white;padding:18px}.wrap{max-width:1000px;margin:25px auto;padding:15px}.card{background:white;padding:20px;border-radius:16px;margin-bottom:15px}input,textarea{width:100%;box-sizing:border-box;padding:11px;margin:6px 0 12px;border:1px solid #ddd;border-radius:9px}button{padding:11px 18px;border:0;border-radius:9px;cursor:pointer}.primary{background:#173b67;color:white}.hidden{display:none}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.exam{border:1px solid #ddd;padding:12px;border-radius:10px;margin:8px 0}.msg{padding:10px;margin:10px 0;border-radius:8px;background:#fff0f0}.ok{background:#e8f8ed}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head>
<body><header><b>آکادمی دکتر میرهلی | سامانه آزمون آنلاین</b> <span id="who"></span></header><div class="wrap">
<div id="login" class="card"><h2>ورود</h2><input id="email" type="email" placeholder="ایمیل"><input id="password" type="password" placeholder="رمز عبور"><button class="primary" id="loginBtn">ورود</button><div id="loginMsg"></div></div>
<div id="app" class="hidden"><div class="tabs"><button data-tab="home">داشبورد</button><button data-tab="create">ساخت آزمون</button><button data-tab="list">آزمون‌ها</button><button id="logoutBtn">خروج</button></div>
<div id="home" class="panel card"><h2>پنل مدیریت</h2><p>نسخه V2 فعال است و ساخت آزمون به Supabase متصل است.</p></div>
<div id="create" class="panel card hidden"><h2>ساخت آزمون جدید</h2><div class="grid"><div>عنوان<input id="title"></div><div>رشته<input id="field"></div><div>زمان شروع<input id="starts" type="datetime-local"></div><div>مدت (دقیقه)<input id="duration" type="number" value="60" min="1"></div></div>
<div>توضیحات<textarea id="description"></textarea></div><label><input id="negative" type="checkbox" checked style="width:auto"> نمره منفی</label><div>جریمه پاسخ غلط<input id="penalty" type="number" step=".0001" value=".3333"></div><div>دستورالعمل<textarea id="instructions"></textarea></div><button class="primary" id="createBtn">ثبت آزمون</button><div id="createMsg"></div></div>
<div id="list" class="panel card hidden"><h2>آزمون‌های ثبت‌شده</h2><div id="examList"></div></div></div></div>
<script>
const sb=supabase.createClient('https://tdyocmljkqknxjecswkn.supabase.co','sb_publishable_rZ7_cS6AKM4TXqBNJJJVqA_DQepIYRl');
let currentUser=null;
function showMsg(el,t,ok=false){el.innerHTML='<div class="msg '+(ok?'ok':'')+'">'+t+'</div>'}
async function enter(u){currentUser=u;const {data,error}=await sb.from('profiles').select('id,full_name,role').eq('id',u.id).single();if(error||data.role!=='admin'){showMsg(loginMsg,'دسترسی مدیر تأیید نشد.');return}login.classList.add('hidden');app.classList.remove('hidden');who.textContent=' — '+(data.full_name||'مدیر سیستم');await loadExams()}
loginBtn.onclick=async()=>{const {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)return showMsg(loginMsg,'خطا: '+error.message);await enter(data.user)}
logoutBtn.onclick=async()=>{await sb.auth.signOut();location.reload()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=async()=>{document.querySelectorAll('.panel').forEach(p=>p.classList.add('hidden'));document.getElementById(b.dataset.tab).classList.remove('hidden');if(b.dataset.tab==='list')await loadExams()})
createBtn.onclick=async()=>{if(!title.value.trim()||!starts.value||!duration.value)return showMsg(createMsg,'عنوان، زمان شروع و مدت آزمون الزامی است.');const row={title:title.value.trim(),description:description.value.trim()||null,starts_at:new Date(starts.value).toISOString(),duration_minutes:+duration.value,negative_marking:negative.checked,wrong_penalty:+penalty.value,field_of_study:field.value.trim()||null,instructions:instructions.value.trim()||null,created_by:currentUser.id};const {data,error}=await sb.from('exams').insert(row).select('id,title').single();if(error)return showMsg(createMsg,'خطا در ثبت: '+error.message);showMsg(createMsg,'آزمون «'+data.title+'» با موفقیت ثبت شد ✓',true);await loadExams()}
async function loadExams(){const {data,error}=await sb.from('exams').select('id,title,starts_at,duration_minutes,status,field_of_study').order('created_at',{ascending:false});if(error){examList.innerHTML=error.message;return}examList.innerHTML=(data||[]).map(e=>'<div class="exam"><b>'+e.title+'</b><br>شروع: '+new Date(e.starts_at).toLocaleString('fa-IR')+' | مدت: '+e.duration_minutes+' دقیقه | وضعیت: '+e.status+'</div>').join('')||'هنوز آزمونی ثبت نشده.'}
(async()=>{const {data:{session}}=await sb.auth.getSession();if(session)await enter(session.user)})();
</script></body></html>
